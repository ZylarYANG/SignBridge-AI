    - data:
        code: "import json\n\ndef main(json_input: str) -> dict:\n    # 默认的失败返回值（安全降级到情况A）\n\
          \    fallback_result = {\n        \"target_label\": \"\", \"prediction_label\"\
          : \"\", \"confidence\": 0.0,\n        \"input_usable\": False, \"overall_score\"\
          : 0,\n        \"handshape_score\": 0, \"trajectory_score\": 0,\n       \
          \ \"position_score\": 0, \"tempo_score\": 0,\n        \"top_error_code\"\
          : \"MALFORMED_JSON\", \"top_error_type\": \"\",\n        \"top_error_severity\"\
          : 0, \"is_correct\": False,\n        \"errors_raw\": \"[]\"\n    }\n\n \
          \   # 空输入保护\n    if not json_input or not json_input.strip():\n        fallback_result[\"\
          top_error_code\"] = \"EMPTY_INPUT\"\n        return fallback_result\n\n\
          \    try:\n        data = json.loads(json_input)\n    except Exception:\n\
          \        return fallback_result\n\n    # 安全提取字段（防嵌套缺失）\n    try:\n     \
          \   target_label = data.get(\"target\", {}).get(\"label\", \"\")\n     \
          \   prediction_label = data.get(\"recognition\", {}).get(\"prediction\"\
          , {}).get(\"label\", \"\")\n        confidence = data.get(\"recognition\"\
          , {}).get(\"confidence\", 0.0)\n        input_usable = data.get(\"quality\"\
          , {}).get(\"input_usable\", True)\n\n        evaluation = data.get(\"evaluation\"\
          , {})\n        overall = evaluation.get(\"overall\", 0)\n        handshape\
          \ = evaluation.get(\"handshape\", {}).get(\"score\", 0)\n        trajectory\
          \ = evaluation.get(\"trajectory\", {}).get(\"score\", 0)\n        position\
          \ = evaluation.get(\"position\", {}).get(\"score\", 0)\n        tempo =\
          \ evaluation.get(\"tempo\", {}).get(\"score\", 0)\n\n        errors = data.get(\"\
          errors\", [])\n        errors_sorted = sorted(errors, key=lambda x: x.get(\"\
          severity\", 0), reverse=True)\n        \n        top_error_code = errors_sorted[0][\"\
